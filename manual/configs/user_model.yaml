# ============================================================================
# GleamLM 用户自定义模型配置模板 — 直接改本文件, 不要动 base.yaml
# ============================================================================
# 用法:
#   1. 改下方「★★★ 必改」标记的段 (模型架构 + 数据路径)。
#   2. 其余段已是 base.yaml 的公共默认值, 需要时再改。
#   3. 训练: python manual/pretrain.py --model manual/configs/user_model.yaml
#      (训练默认超参自动复用本文件 training/lr/advanced 段, 无需 --training)
#
# 设计约定 (ADR-0011 / 配置三级管理):
#   - 本文件与 base/nano/lite/pro 一样是全量自包含快照, 不 extends 任何文件;
#     base.yaml 仅作新模板参考, 请勿修改 base.yaml 本身。
#   - 模型段故意用 0 占位 —— 忘改时会触发配置校验报错 (d_model >= 64),
#     不会静默用 nano 架构训练。
#   - 架构参数 (d_model 等) 无 CLI 覆写口, 只读本文件; 实验级参数
#     (epochs/lr 等) 可用 CLI 覆写 (default=None + YAML 裁决)。

# ---- 预训练控制 (公共默认, 按需改) ----
training:
  seed: 42
  epochs: 1
  batch_size: 8
  accumulate_grad: 8
  clip_grad: 1.0
  weight_decay: 0.01
  label_smoothing: 0.1
  log_interval: 50
  eval_interval: 500
  save_interval: 2000
  max_train_chars: 6130000000   # 单遍数据预算 (字符数)

# ---- 学习率 (默认 WSD) ----
lr:
  type: wsd
  wsd_decay_style: linear       # WSD decay 段线性 (nano/SmolLM3 实证)
  lr: 0.0004
  warmup_ratio: 0.02
  stable_ratio: 0.80
  min_lr_ratio: 0.1

# ---- 优化器 ----
optimizer:
  type: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8

# ★★★ 必改: 模型架构 — 0 为占位, 忘改会在校验时报错 ★★★
model:
  vocab_size: 0                 # ← 填你的词表大小 (BBPE 12K = 12002)
  d_model: 0                    # ← 隐藏维度 (如 512/768/1024)
  num_layers: 0                 # ← 层数 (中文生成至少 12, 见 ADR-0001)
  num_heads: 0                  # ← 注意力头数
  num_kv_heads: 0               # ← KV 头数 (GQA, 如 num_heads/2)
  d_ff: 0                       # ← SwiGLU 中间维 (标准 8/3 × d_model)
  max_seq_len: 1024             # 训练序列长度 (按显存调整)
  dropout: 0.0
  tie_weights: true
  use_flash_attn: false         # 无 flash-attn 环境保持 false, CPU 亦可训练
  # 可选架构开关 (缺省走 Pydantic 默认, 见 gleamlm/utils/config.py):
  #   use_gradient_checkpointing: true   # 显存紧张时开启
  #   attn_type: gqa | mamba             # 默认 gqa
  #   ffn_type: mlp | moe                # 默认 mlp

# ★★★ 必改: 数据路径 (相对仓库根目录或绝对路径) ★★★
data:
  data_dir: data/user/pretrain   # ← 你的预训练 .bin/.idx 目录
  tokenizer_path: gleamlm/tokenizer/checkpoints/bbpe_12k
  checkpoint_dir: checkpoints/user   # ← 你的模型保存目录
  ids_prefix: ""
  load_checkpoint: null          # 续训起点模型权重 (可选)

# ---- 预训练数据源 (train_tokenizer --variant 时读取; 比例按需改) ----
data_sources:
  - {name: edu, type: text, ratio: 0.55}
  - {name: news, type: news, ratio: 0.27}
  - {name: wiki, type: text, ratio: 0.12}
  - {name: baike, type: text, ratio: 0.06}

# ---- 高级 (公共默认, 按需改) ----
advanced:
  z_loss_weight: 0.0001        # z-loss 防 logits 爆炸 (置 0 关闭)
  bf16: true
  pin_memory: true
  num_workers: 0               # Windows + memmap: 0 is fastest; Linux: try 2-4

# ---- SFT 微调 (公共默认, 按需改) ----
sft:
  epochs: 3
  batch_size: 8
  accumulate_grad: 4
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.02
  stable_ratio: 0.80           # WSD 专用 (cosine 时忽略)
  min_lr_ratio: 0.05           # cosine 终点比例
  weight_decay: 0.01
  max_seq_len: 1024
  inject_system_ratio: 0.2
  data_path: data/user/sft/sft_data.jsonl   # ← 你的 SFT 数据

# ---- DPO 偏好对齐 (公共默认, 按需改) ----
dpo:
  epochs: 1
  batch_size: 2
  accumulate_grad: 2
  lr: 1.0e-6
  beta: 0.3                    # 定稿值, 勿回退 0.1 (历史坑①: KL 约束偏弱)
  lr_scheduler: cosine
  stable_ratio: 0.80           # WSD 专用 (cosine 时忽略)
  max_seq_len: 1024
  warmup_ratio: 0.02
  min_lr_ratio: 0.05
  data_path: data/user/dpo/dpo_data.jsonl   # ← 你的 DPO 数据

# ---- OPD 在线策略蒸馏 (公共默认, 按需改) ----
opd:
  epochs: 4
  batch_size: 2
  n_samples: 2
  lr: 5.0e-6
  weight_decay: 0.01
  clip_grad: 1.0
  max_seq_len: 1024
  max_new_tokens: 128
  temperature: 1.0
  entropy_coeff: 0.01
  aux_coeff: 0.01
  log_interval: 5
  save_interval: 10
  seed: 42
  data_path: data/user/opd_prompts.jsonl   # ← 你的 OPD prompt 数据

# ---- LoRA 微调 (可选路线, 公共默认) ----
lora:
  epochs: 3
  batch_size: 4
  lr: 2.0e-4
  clip_grad: 1.0
  max_seq_len: 1024
  lora_r: 8
  lora_alpha: 16
  log_interval: 10
  data_path: data/user/sft/sft_data.jsonl

# ---- 分布式 ----
distributed:
  backend: auto   # auto: Windows 自动回退 gloo, Linux 使用 nccl
