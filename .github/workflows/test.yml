name: Test

on:
  push:
    branches: [main, master]
    # 纯文档/资源改动不触发测试。每次 push 的 job 数 = 整个 matrix 各 checkout
    # 一次，改 README 也跑全套测试，既白占排队时间也污染 Insights 的 clone 统计
    #（2026-09 实测：近 14 天 1,072 次 clone 里约 44% 是自家 CI 的 checkout）。
    # pull_request 有意不过滤 —— 外部 PR 是别人写的代码，宁可多跑。
    # ⚠️ 若将来给 main 加分支保护并要求 test 必过，paths-ignore 会让被跳过的
    # push 停在 "Expected — Waiting for status"，届时须改成 paths 白名单。
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "assets/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"

  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 组合数 = 每次 push 的 checkout 次数。原为 2 OS × 3 Python = 6 个 job，
      # 收敛到 3 个：两个 OS 各验一次主力版本，Python 下限（requires-python
      # 声明 >=3.10）在 Linux 上单独验一次。
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # serve extra 必须装：tests/test_webui_api.py 在第 20-21 行用
      # pytest.importorskip("fastapi"/"httpx") 整模块跳过；缺 serve 时
      # 那 18 个用例在 CI 中永远不会执行，而 pytest 步骤仍显示为绿（假绿）。
      - run: pip install -e ".[dev,hf,serve]"

      # --cov-fail-under=60：实测总覆盖率 66%（3476 stmts / 1186 missed，2026-09 Windows+py3.12），
      # 留 6pp 余量以适应跨 OS / Python 版本差异。覆盖率此前只打印不拦截，等于没有回归保护。
      - run: python -m pytest tests/ -v --cov=gleamlm --cov-report=term --cov-fail-under=60

      # mypy 必须排在 ruff 之前：ruff 是纯 lint，一旦它失败，排在后面的步骤
      # 会被 GitHub Actions 直接 skipped。曾因此导致类型门禁自 2026-09-07 起
      # 静默失效数日无人察觉。类型检查是核心库门禁，优先级高于 lint。
      - run: python -m mypy gleamlm/

      - run: ruff check

      # 格式门禁：pre-commit 的 ruff-format 只作用于**暂存文件**（增量），
      # 未被触碰的文件格式违规永远不会暴露——2026-09 之前因此累积了 11 个未格式化文件。
      # CI 全仓检查格式，才能兜住 pre-commit 结构上看不见的存量。
      - run: ruff format --check .
